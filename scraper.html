<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YML Scraper</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
        pre { background: #f4f4f4; padding: 10px; border: 1px solid #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>YML Feed Generator</h1>
    <p>Нажмите кнопку для запуска скрапера и генерации YML фида.</p>
    <button id="generate">Запустить скрапер</button>
    <pre id="output"></pre>

    <script>
        const button = document.getElementById('generate');
        const output = document.getElementById('output');

        button.addEventListener('click', async () => {
            output.textContent = 'Запуск скрапера... Пожалуйста, подождите.';
            button.disabled = true;

            try {
                // Замените URL на ваш Vercel API endpoint
                const response = await fetch('https://yml-scraper-plus-drab.vercel.app/api/scraper');
                
                if (response.ok) {
                    const yml = await response.text();
                    output.textContent = yml;
                } else {
                    output.textContent = 'Ошибка: ' + response.statusText;
                }
            } catch (error) {
                output.textContent = 'Ошибка: ' + error.message;
            }

            button.disabled = false;
        });
    </script>
</body>
</html>
