name: Scraper YML Feed

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          CATEGORY_URL: ${{ secrets.CATEGORY_URL }}
          SHOP_NAME: ${{ vars.SHOP_NAME || 'My Shop' }}
          SHOP_COMPANY: ${{ vars.SHOP_COMPANY || 'My Company' }}
          SHOP_URL: ${{ vars.SHOP_URL || '' }}
          USER_AGENT: ${{ vars.USER_AGENT || 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' }}
          SELECTOR_PRODUCT_LINKS: ${{ vars.SELECTOR_PRODUCT_LINKS || 'li.item a' }}
          SELECTOR_NEXT_PAGE: ${{ vars.SELECTOR_NEXT_PAGE || 'a.ty-pagination__next' }}
          SELECTOR_TITLE: ${{ vars.SELECTOR_TITLE || 'h1.ty-product-block-title' }}
          SELECTOR_PRICE: ${{ vars.SELECTOR_PRICE || 'span.ty-price-num' }}
          SELECTOR_DESCRIPTION: ${{ vars.SELECTOR_DESCRIPTION || 'div.kits-block' }}
          SELECTOR_IMAGES: ${{ vars.SELECTOR_IMAGES || 'a.cm-image-previewer' }}
          SELECTOR_ARTICLE: ${{ vars.SELECTOR_ARTICLE || '' }}
          SELECTOR_AVAILABILITY: ${{ vars.SELECTOR_AVAILABILITY || '' }}
        run: python scraper/scraper.py

      - name: Commit and push feed.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.yml
          git diff --cached --quiet || git commit -m "Update feed.yml [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
